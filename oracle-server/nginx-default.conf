server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Erodium Oracle Stream Preloader & NVMe Video Cache
    location /erodium-stream/ {
        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 50M;
    }

    root /home/ubuntu/monopoly-go-hub/dist;
    index index.html;

    # Static assets cache
    location /assets/ {
        alias /home/ubuntu/monopoly-go-hub/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /cards/ {
        alias /home/ubuntu/monopoly-go-hub/public/cards/;
        expires 30d;
    }

    location /avatars/ {
        alias /home/ubuntu/monopoly-go-hub/public/avatars/;
        expires 30d;
    }

    location /sets/ {
        alias /home/ubuntu/monopoly-go-hub/public/sets/;
        expires 30d;
    }

    # API Proxy to Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # WebSocket Proxy
    location /ws {
        proxy_pass http://127.0.0.1:3001/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Client-side SPA routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
