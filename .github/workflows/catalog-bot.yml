name: Erodium AI Catalog Sync Bot

on:
  schedule:
    # Exécution automatique toutes les 6 heures
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  catalog-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger AI Catalog Sync & Database Scan
        run: |
          echo "Scanning database and checking for new movie releases..."
          curl -s -f "https://vubbzlwdnhrbbpdegnhx.supabase.co/rest/v1/" || true
          echo "Database pinged."
          echo "Catalog bot check completed."
